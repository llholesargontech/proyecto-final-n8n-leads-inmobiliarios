<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f6f3ee"/>
<style>
text{font-family:Arial,sans-serif;fill:#252525}
.t{font-size:24px;font-weight:bold}.s{font-size:15px}.n{font-size:18px;font-weight:bold}
.b{fill:#fff;stroke:#555;stroke-width:2}.ai{fill:#edf5ed;stroke:#4b8b57;stroke-width:2}.side{fill:#faf8f4;stroke:#777;stroke-width:2}
.a{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}
.d{stroke:#777;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#m2)}
.label{font-size:14px;fill:#555}
</style>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker>
<marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#777"/></marker>
</defs>

<text x="45" y="45" class="t">Precalificacion de leads inmobiliarios</text>
<text x="45" y="73" class="s">flujo actual con validacion, agente y RAG</text>

<rect x="40" y="135" width="150" height="70" rx="10" class="b"/>
<text x="75" y="166" class="n">Webhook</text><text x="65" y="190" class="s">lead_id + mensaje</text>

<rect x="235" y="135" width="160" height="70" rx="10" class="b"/>
