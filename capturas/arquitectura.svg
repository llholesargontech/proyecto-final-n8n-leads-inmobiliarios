<path d="M190 170h45M395 170h45M615 170h45M830 170h45" class="a"/>

<rect x="875" y="285" width="190" height="80" rx="10" class="ai"/>
<text x="906" y="318" class="n">AI Agent</text><text x="897" y="343" class="s">clasifica y decide</text>

<rect x="1050" y="135" width="120" height="70" rx="10" class="b"/>
<text x="1062" y="166" class="n">Respond</text><text x="1065" y="190" class="s">JSON final</text>

