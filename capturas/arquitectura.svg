<path d="M995 170h55" class="a"/><text x="1003" y="158" class="label">false</text>
<path d="M970 365v105h140V205" class="a"/><text x="985" y="455" class="label">respuesta de control</text>

<rect x="650" y="455" width="190" height="70" rx="10" class="side"/>
<text x="680" y="485" class="n">Google Gemini</text><text x="682" y="508" class="s">modelo de chat</text>

<rect x="875" y="455" width="190" height="70" rx="10" class="side"/>
<text x="900" y="485" class="n">Simple Memory</text><text x="895" y="508" class="s">sesion por lead_id</text>

